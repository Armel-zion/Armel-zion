<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040b"/><stop offset="0.62" stop-color="#0b0f2a"/><stop offset="1" stop-color="#150a2e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="0.5" stop-color="#ff4fa3"/><stop offset="1" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="floor"><rect x="0" y="250" width="1200" height="110"/></clipPath>
    <clipPath id="sunclip"><rect x="0" y="0" width="1200" height="250"/></clipPath>
    <style>
      .hl{animation:move 1.6s linear infinite}
      @keyframes move{from{transform:translateY(0)}to{transform:translateY(22px)}}
      .scan{animation:scan 5s linear infinite}
      @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(380px)}}
      .pulse{animation:pulse 1.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
      .blink{animation:pulse 1s steps(1) infinite}
      .flick{animation:flick 6s linear infinite}
      @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.4}95%{opacity:1}96%{opacity:.6}}
      .ring{animation:ring 3s linear infinite}
      @keyframes ring{to{stroke-dashoffset:-56}}
      .star{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.9}50%{opacity:.15}}
      text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'Courier New',Consolas,monospace}
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- étoiles -->
  <g fill="#ffffff">
    <circle class="star" cx="80" cy="40" r="1.4"/><circle class="star" cx="210" cy="95" r="1" style="animation-delay:1s"/>
    <circle class="star" cx="330" cy="30" r="1.2" style="animation-delay:.5s"/><circle class="star" cx="470" cy="70" r="0.9" style="animation-delay:2s"/>
    <circle class="star" cx="760" cy="36" r="1.3" style="animation-delay:1.5s"/><circle class="star" cx="890" cy="92" r="1" style="animation-delay:.2s"/>
    <circle class="star" cx="1010" cy="48" r="1.4" style="animation-delay:2.4s"/><circle class="star" cx="1130" cy="110" r="1" style="animation-delay:.8s"/>
    <circle class="star" cx="150" cy="170" r="0.8" style="animation-delay:1.2s"/><circle class="star" cx="1060" cy="190" r="0.9" style="animation-delay:.4s"/>
  </g>

  <!-- soleil synthwave -->
  <g clip-path="url(#sunclip)">
    <circle cx="600" cy="250" r="110" fill="#ff4fa3" opacity=".22" filter="url(#soft)"/>
    <circle cx="600" cy="250" r="78" fill="url(#sun)"/>
    <g fill="#0b0f2a">
      <rect x="510" y="212" width="180" height="3"/><rect x="510" y="222" width="180" height="5"/>
      <rect x="510" y="233" width="180" height="6"/><rect x="510" y="244" width="180" height="8"/>
    </g>
  </g>

  <!-- anneau orbital -->
  <g opacity=".6">
    <ellipse class="ring" cx="600" cy="250" rx="330" ry="40" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="4 10"/>
  </g>

  <!-- sol grille -->
  <rect x="0" y="250" width="1200" height="110" fill="#07051a"/>
  <g clip-path="url(#floor)" stroke="#ff4fa3" stroke-width="1.2" opacity=".85">
    <g class="hl">
      <line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="258" x2="1200" y2="258"/>
      <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="286" x2="1200" y2="286"/>
      <line x1="0" y1="306" x2="1200" y2="306"/><line x1="0" y1="330" x2="1200" y2="330"/>
      <line x1="0" y1="358" x2="1200" y2="358"/><line x1="0" y1="236" x2="1200" y2="236"/>
    </g>
    <g stroke="#00f0ff" opacity=".7">
      <line x1="600" y1="250" x2="600" y2="360"/>
      <line x1="600" y1="250" x2="480" y2="360"/><line x1="600" y1="250" x2="720" y2="360"/>
      <line x1="600" y1="250" x2="330" y2="360"/><line x1="600" y1="250" x2="870" y2="360"/>
      <line x1="600" y1="250" x2="150" y2="360"/><line x1="600" y1="250" x2="1050" y2="360"/>
      <line x1="600" y1="250" x2="-80" y2="360"/><line x1="600" y1="250" x2="1280" y2="360"/>
    </g>
  </g>
  <line x1="0" y1="250" x2="1200" y2="250" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>

  <!-- HUD -->
  <g class="mono" font-size="13" fill="#00f0ff">
    <path d="M24 22 h36 M24 22 v36" stroke="#00f0ff" stroke-width="2" fill="none"/>
    <path d="M1176 22 h-36 M1176 22 v36" stroke="#00f0ff" stroke-width="2" fill="none"/>
    <circle class="pulse" cx="44" cy="76" r="5" fill="#39ff88"/>
    <text x="58" y="81" class="mono" fill="#39ff88">SYS://ONLINE</text>
    <text x="1156" y="81" class="mono" text-anchor="end" fill="#ff4fa3">TIMELINE 2026 ▸ 2090</text>
  </g>

  <!-- titre -->
  <g class="flick">
    <text x="600" y="108" text-anchor="middle" font-size="64" font-weight="800" letter-spacing="10" fill="url(#title)" filter="url(#glow)">ARMEL ZION</text>
  </g>
  <text x="600" y="142" text-anchor="middle" font-size="18" letter-spacing="5" fill="#e8e9ff" class="mono">DÉVELOPPEUR FULLSTACK &amp; DEVOPS // EN FORMATION</text>
  <text x="600" y="166" text-anchor="middle" font-size="14" letter-spacing="3" fill="#9aa3ff" class="mono">BACHELOR 2 INFORMATIQUE · NANTES YNOV CAMPUS<tspan class="blink" fill="#00f0ff"> ▌</tspan></text>

  <!-- balayage -->
  <rect class="scan" x="0" y="0" width="1200" height="3" fill="#00f0ff" opacity=".12"/>
</svg>
